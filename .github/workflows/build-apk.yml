name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_AI_BASE_URL: https://api.proxyapi.ru/v1
      EXPO_PUBLIC_AI_MODEL: gpt-4o-mini
      EXPO_PUBLIC_AI_VOICE_MODEL: whisper-1
      EXPO_PUBLIC_AI_PROXY_URL: https://nutribear-ai.popovakatua2013.workers.dev/v1
      EXPO_PUBLIC_AI_PROXY_SECRET: ${{ secrets.NB_PROXY_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pandroid.compileSdkVersion=37

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriBear-APK
          path: android/app/build/outputs/apk/release/app-release.apk
